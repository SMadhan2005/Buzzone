<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Reservation System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Bus Reservation System</h1>
        <nav>
          <ul>
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#search">Search</a></li>
            <li><a href="#bookings">My Bookings</a></li>
            <li>
              <a href="admin-login.html" class="admin-link">Admin Login</a>
            </li>
          </ul>
        </nav>
      </header>

      <main>
        <section id="search" class="search-section">
          <h2>Search Buses</h2>
          <form id="searchForm" class="search-form">
            <div class="form-group">
              <label for="from">From:</label>
              <input type="text" id="from" name="from" required />
            </div>
            <div class="form-group">
              <label for="to">To:</label>
              <input type="text" id="to" name="to" required />
            </div>
            <div class="form-group">
              <label for="date">Date:</label>
              <input type="date" id="date" name="date" required />
            </div>
            <button type="submit" class="btn">Search Buses</button>
          </form>
        </section>

        <section id="results" class="results-section">
          <h2>Available Buses</h2>
          <div id="busList" class="bus-list">
            <!-- Bus cards will be dynamically added here -->
          </div>
        </section>

        <section id="booking" class="booking-section hidden">
          <h2>Book Your Seat</h2>
          <div class="bus-details">
            <h3 id="selectedBusNumber"></h3>
            <p>From: <span id="selectedFrom"></span></p>
            <p>To: <span id="selectedTo"></span></p>
            <p>Departure: <span id="selectedDeparture"></span></p>
            <p>Available Seats: <span id="selectedSeats"></span></p>
            <p>Price per Seat: $<span id="selectedPrice"></span></p>
          </div>
          <form id="bookingForm" class="booking-form">
            <div class="form-group">
              <label for="passengerName">Full Name:</label>
              <input type="text" id="passengerName" required />
            </div>
            <div class="form-group">
              <label for="passengerEmail">Email:</label>
              <input type="email" id="passengerEmail" required />
            </div>
            <div class="form-group">
              <label for="seats">Number of Seats:</label>
              <input type="number" id="seats" min="1" max="6" required />
            </div>
            <div class="form-group">
              <p>Total Price: $<span id="totalPrice">0</span></p>
            </div>
            <button type="submit" class="btn">Confirm Booking</button>
          </form>
        </section>

        <section id="bookings" class="my-bookings-section">
          <h2>My Bookings</h2>
          <div id="bookingsList" class="bookings-list">
            <!-- Bookings will be dynamically added here -->
          </div>
        </section>
      </main>

      <footer>
        <p>&copy; 2024 Bus Reservation System. All rights reserved.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
